id = "ghostvt"
name = "iGhostVT bridge"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Open herdr terminals from iGhostVT on iPhone, iPad and Mac, on the local network or through an iGhostVT relay"
platforms = ["macos", "linux"]

# Starts the bridge daemon in the background (it outlives this hook and ends
# with the herdr server).
[[startup]]
command = ["node", "src/start.js"]

[[actions]]
id = "pair"
title = "Pair an iGhostVT device"
description = "Show a six-digit code to enter in iGhostVT"
contexts = ["global"]
command = ["node", "src/actions/open-pane.js", "pair"]

[[actions]]
id = "panel"
title = "iGhostVT bridge"
description = "Paired devices, relay and status of the iGhostVT bridge"
contexts = ["global"]
command = ["node", "src/actions/open-pane.js", "panel"]

[[panes]]
id = "pair"
title = "Pair an iGhostVT device"
placement = "popup"
width = "70%"
height = "60%"
command = ["node", "src/panes/pair.js"]

[[panes]]
id = "panel"
title = "iGhostVT bridge"
placement = "popup"
width = "80%"
height = "70%"
command = ["node", "src/panes/panel.js"]
